apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backbone
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-backbone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-backbone
    spec:
      containers:
        - name: api
          image: fastapi-backbone:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: fastapi-backbone-config
            - secretRef:
                name: fastapi-backbone
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
