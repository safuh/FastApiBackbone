services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      APP_NAME: FastAPI Backbone
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://backbone:backbone@db:5432/backbone
      LOG_JSON: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backbone
      POSTGRES_USER: backbone
      POSTGRES_PASSWORD: backbone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backbone -d backbone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
