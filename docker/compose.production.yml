services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-FastAPI Backbone}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
