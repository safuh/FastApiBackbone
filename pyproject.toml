[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-backbone"
version = "0.1.0"
description = "Production-grade infrastructure and project-generation foundation for FastAPI services."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Safu Harry", email = "harrysafu@gmail.com"}]
keywords = ["fastapi", "sqlalchemy", "alembic", "jwt", "flutter", "docker", "kubernetes", "backend", "scaffolding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "structlog>=24.4,<26.0",
    "PyJWT>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "build>=1.2,<2.0",
    "twine>=5.1,<7.0",
]

[project.urls]
Homepage = "https://github.com/safuh/FastApiBackbone"
Repository = "https://github.com/safuh/FastApiBackbone"
Issues = "https://github.com/safuh/FastApiBackbone/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fastapi_backbone*"]
