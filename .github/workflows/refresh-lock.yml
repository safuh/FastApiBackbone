name: Refresh lockfile

on:
  push:
    branches:
      - feat/production-docker-reproducibility

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
      - name: Refresh uv lockfile
        run: uv lock
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh uv lockfile"
          git push origin HEAD:feat/production-docker-reproducibility
