name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: backbone
          POSTGRES_USER: backbone
          POSTGRES_PASSWORD: backbone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backbone -d backbone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://backbone:backbone@localhost:5432/backbone
        run: pytest
      - name: Build distributions
        if: matrix.python-version == '3.13'
        run: python -m build
      - name: Validate distributions
        if: matrix.python-version == '3.13'
        run: twine check dist/*
