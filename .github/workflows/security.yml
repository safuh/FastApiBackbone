name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependencies
        run: pip-audit -r <(python - <<'PY'
from pathlib import Path
text = Path("pyproject.toml").read_text()
start = text.index('dependencies = [')
end = text.index(']\n\n[project.optional-dependencies]', start) + 1
print("", end="")
PY
        shell: bash
